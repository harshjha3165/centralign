id: 03_ambiguous
task: >-
  Find the latest Northwind invoice, enter the amount due and due date into
  Ledger, and tell me when you're done.
fault: none
ui_variant: a

seed:
  invoices:
    - filename: northwind_traders_5101.pdf
      vendor: "Northwind Traders"
      invoice_no: "NT-5101"
      invoice_date: "2026-10-02"
      terms_days: 30
      subtotal: 30000.00
      tax: 1500.00
      advance_paid: 0.00
    - filename: northwind_trading_co_7788.pdf
      vendor: "Northwind Trading Co"
      invoice_no: "NTC-7788"
      invoice_date: "2026-10-02"
      terms_days: 15
      subtotal: 9000.00
      tax: 450.00
      advance_paid: 0.00
  existing_bills: []

# Two lookalike vendors both named "Northwind", both invoiced the SAME day (so
# "latest by date" can't break the tie): the task text is genuinely ambiguous
# about which vendor is meant, and the worker should ask rather than guess.
ask_user_replies:
  - "Northwind Traders"

expect:
  band: Medium
  bills:
    - vendor: "Northwind Traders"
      invoice_no: "NT-5101"
      amount: 31500.00
      due_date: "2026-11-01"
      status: open
  bill_count: 1
  db_added: 1
  db_changed: 0
  db_deleted: 0
  ask_user_called: true
  no_write_before_ask_user: true
  define_done_first: true
